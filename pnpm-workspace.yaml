packages:
  - apps/*
  - packages/*

# One place for shared tool and library versions. Packages reference them as "catalog:".
catalog:
  "@eslint/js": 10.0.1
  "@next/eslint-plugin-next": 16.3.6
  "@t3-oss/env-nextjs": 0.13.11
  "@types/node": 22.20.4
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  eslint: 10.11.0
  eslint-import-resolver-typescript: 4.4.5
  eslint-plugin-boundaries: 7.2.0
  globals: 17.12.0
  next: 16.3.6
  react: 19.3.0
  react-dom: 19.3.0
  server-only: 0.0.1
  tsx: 4.23.15
  turbo: 2.11.4
  # TypeScript 7 is outside the typescript-eslint 8 peer range (>=4.8.4 <6.1.0), so this pins the newest 5.x.
  typescript: 5.9.3
  typescript-eslint: 8.70.1
  vite: 8.3.1
  vitest: 5.0.2
  zod: 4.6.5

# unrs-resolver and esbuild (through tsx) ship prebuilt bindings, so their postinstalls are not needed.
ignoredBuiltDependencies:
  - esbuild
  - unrs-resolver
