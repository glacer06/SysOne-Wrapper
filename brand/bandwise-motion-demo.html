<!doctype html><meta charset="utf-8"><title>bandwise motion concept</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Schibsted+Grotesk:wght@400..900&family=JetBrains+Mono:wght@100..800&display=swap">
<style>/* bandwise design tokens v1.0 - cool palette, no warm tones.
   Fonts (all OFL, Google Fonts): Archivo (variable wdth+wght), Schibsted Grotesk, JetBrains Mono.
   Usage: <html data-theme="light"> or "dark". Components read only the semantic (--bw-*) layer. */

:root {
  /* ---- primitives: neutral (cool ink to cool white) ---- */
  --bw-ink-950: #0D1417;
  --bw-ink-900: #131D22;
  --bw-ink-800: #1B282E;
  --bw-ink-700: #2A3A41;
  --bw-slate-600: #5B6B70;
  --bw-slate-400: #8A9A9F;
  --bw-slate-300: #B7C3C5;
  --bw-slate-200: #D9E1E1;
  --bw-slate-100: #E8EEED;
  --bw-white-50: #F2F5F4;
  --bw-white-0: #FFFFFF;
  /* ---- primitives: teal (brand, the HIGH band) ---- */
  --bw-teal-900: #08463D;
  --bw-teal-700: #0B7060;
  --bw-teal-500: #12A38A;
  --bw-teal-300: #4FD1B5;
  --bw-teal-100: #D4F1EA;
  /* ---- primitives: violet (the MEDIUM band) ---- */
  --bw-violet-600: #5B4BD6;
  --bw-violet-400: #8B7CF6;
  --bw-violet-100: #E7E4FD;
  /* ---- primitives: red (the LOW band, errors; cool crimson, never orange) ---- */
  --bw-red-600: #C4203D;
  --bw-red-500: #D92D4A;
  --bw-red-300: #FF6B83;
  --bw-red-100: #FBE1E6;

  /* ---- type ---- */
  --bw-font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;   /* use with font-stretch:125% weight 800 */
  --bw-font-body: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --bw-font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --bw-text-display: 64px;  --bw-lh-display: 1.04;
  --bw-text-h1: 48px;       --bw-lh-h1: 1.08;
  --bw-text-h2: 36px;       --bw-lh-h2: 1.12;
  --bw-text-h3: 24px;       --bw-lh-h3: 1.2;
  --bw-text-h4: 18px;       --bw-lh-h4: 1.3;
  --bw-text-body: 16px;     --bw-lh-body: 1.55;
  --bw-text-small: 14px;    --bw-lh-small: 1.5;
  --bw-text-caption: 12px;  --bw-lh-caption: 1.4;
  --bw-track-display: -0.02em;
  --bw-track-label: 0.08em;

  /* ---- spacing (4px base) ---- */
  --bw-space-0: 0;   --bw-space-1: 4px;  --bw-space-2: 8px;  --bw-space-3: 12px;
  --bw-space-4: 16px; --bw-space-5: 24px; --bw-space-6: 32px; --bw-space-7: 48px;
  --bw-space-8: 64px; --bw-space-9: 96px;

  /* ---- shape: faceted. Small radii; the signature is the chamfer. ---- */
  --bw-radius-0: 0;  --bw-radius-sm: 2px;  --bw-radius-md: 4px;  --bw-radius-lg: 8px;  --bw-radius-pill: 999px;
  --bw-chamfer: 8px;  /* top-right + bottom-left corner cut on primary buttons, cards, badges */
  --bw-border-width: 1px;
  --bw-focus-width: 2px;  --bw-focus-offset: 2px;

  /* ---- motion ---- */
  --bw-dur-instant: 80ms;  --bw-dur-fast: 140ms;  --bw-dur-base: 240ms;  --bw-dur-slow: 480ms;  --bw-dur-walk: 1400ms;
  --bw-ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --bw-ease-settle: cubic-bezier(0.34, 1.4, 0.64, 1);  /* the load set-down: one small overshoot */
  --bw-ease-walk: cubic-bezier(0.45, 0, 0.25, 1);

  /* ---- layout ---- */
  --bw-bp-sm: 640px; --bw-bp-md: 960px; --bw-bp-lg: 1280px;  --bw-content-max: 1200px;  --bw-prose-max: 68ch;
}

/* ---- semantic layer: LIGHT ---- */
:root, [data-theme="light"] {
  --bw-bg: var(--bw-white-50);
  --bw-surface: var(--bw-white-0);
  --bw-surface-sunken: var(--bw-slate-100);
  --bw-border: var(--bw-slate-200);
  --bw-border-strong: var(--bw-slate-300);
  --bw-text: var(--bw-ink-950);
  --bw-text-muted: var(--bw-slate-600);
  --bw-brand: var(--bw-teal-500);            /* fills and graphics only, 2.9:1 on white */
  --bw-brand-text: var(--bw-teal-700);       /* links, text, 5.5:1 */
  --bw-on-brand: var(--bw-ink-950);          /* text on teal fills, 5.9:1 */
  --bw-high: var(--bw-teal-500);   --bw-high-text: var(--bw-teal-700);   --bw-high-bg: var(--bw-teal-100);
  --bw-medium: var(--bw-violet-400); --bw-medium-text: var(--bw-violet-600); --bw-medium-bg: var(--bw-violet-100);
  --bw-low: var(--bw-red-500);     --bw-low-text: var(--bw-red-600);     --bw-low-bg: var(--bw-red-100);
  --bw-focus: var(--bw-violet-600);
  --bw-overlay: rgba(13, 20, 23, 0.56);
}
/* ---- semantic layer: DARK ---- */
[data-theme="dark"] {
  --bw-bg: var(--bw-ink-950);
  --bw-surface: var(--bw-ink-900);
  --bw-surface-sunken: #0A1013;
  --bw-border: var(--bw-ink-700);
  --bw-border-strong: #3B4D55;
  --bw-text: var(--bw-white-50);
  --bw-text-muted: var(--bw-slate-400);
  --bw-brand: var(--bw-teal-300);
  --bw-brand-text: var(--bw-teal-300);
  --bw-on-brand: var(--bw-ink-950);
  --bw-high: var(--bw-teal-300);   --bw-high-text: var(--bw-teal-300);   --bw-high-bg: rgba(79, 209, 181, 0.14);
  --bw-medium: var(--bw-violet-400); --bw-medium-text: var(--bw-violet-400); --bw-medium-bg: rgba(139, 124, 246, 0.16);
  --bw-low: var(--bw-red-300);     --bw-low-text: var(--bw-red-300);     --bw-low-bg: rgba(255, 107, 131, 0.14);
  --bw-focus: var(--bw-teal-300);
  --bw-overlay: rgba(0, 0, 0, 0.64);
}
@media (prefers-reduced-motion: reduce) {
  :root { --bw-dur-fast: 0ms; --bw-dur-base: 0ms; --bw-dur-slow: 0ms; --bw-dur-walk: 0ms; }
}

body{margin:0;background:var(--bw-bg);color:var(--bw-text);font:400 16px/1.55 var(--bw-font-body);display:grid;place-items:center;min-height:100vh}
.wrap{width:min(900px,92vw)} h1{font:800 34px/1.05 var(--bw-font-display);font-stretch:125%;letter-spacing:-.02em;margin:0 0 6px} p{color:var(--bw-text-muted);margin:0 0 28px}
.lane{position:relative;height:190px;margin-top:20px} .actor{position:absolute;left:0;bottom:22px;width:110px;height:130px;will-change:transform}
.actor img{position:absolute;inset:0;width:100%;height:100%} .ant{animation:bob 350ms steps(2,jump-none) infinite paused}
.ruler{position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(90deg,var(--bw-low) 0 55%,var(--bw-medium) 55% 80%,var(--bw-high) 80% 100%)}
.score{position:absolute;bottom:-40px;left:0;font:600 14px var(--bw-font-mono);color:var(--bw-text-muted);width:100%} .score b{position:absolute;transform:translateX(-50%);opacity:0;color:var(--bw-text)}
.go .actor{animation:walk var(--bw-dur-walk) var(--bw-ease-walk) forwards} .go .ant{animation-play-state:running;animation-duration:350ms;animation-iteration-count:4} .go .load{animation:set var(--bw-dur-slow) var(--bw-ease-settle) 1400ms forwards} .go .score b{animation:fade var(--bw-dur-base) ease 1700ms forwards}
@keyframes walk{to{transform:translateX(calc(min(900px,92vw) * .71 - 55px))}} @keyframes bob{50%{transform:translateY(-3px)}} @keyframes set{from{transform:translateY(-14px)}to{transform:translateY(0)}} @keyframes fade{to{opacity:1}}
.load{transform:translateY(-14px)} button{margin-top:70px} @media (prefers-reduced-motion:reduce){.go .actor{animation:none;transform:translateX(calc(min(900px,92vw) * .71 - 55px))} .load{animation:none!important;transform:none} .score b{animation:none!important;opacity:1}}
/* bandwise components v1.0 - reads only --bw-* semantic tokens from bandwise-tokens.css */
.bw-body { background: var(--bw-bg); color: var(--bw-text); font: 400 var(--bw-text-body)/var(--bw-lh-body) var(--bw-font-body); }
.bw-display { font-family: var(--bw-font-display); font-stretch: 125%; font-weight: 800; letter-spacing: var(--bw-track-display); line-height: var(--bw-lh-display); }
.bw-label { font: 500 var(--bw-text-caption)/var(--bw-lh-caption) var(--bw-font-mono); letter-spacing: var(--bw-track-label); text-transform: uppercase; color: var(--bw-text-muted); }
.bw-data { font-family: var(--bw-font-mono); font-variant-numeric: tabular-nums; }

/* Button: chamfered primary */
.bw-btn { --c: var(--bw-chamfer); display: inline-flex; align-items: center; gap: var(--bw-space-2); height: 40px; padding: 0 var(--bw-space-5);
  font: 600 var(--bw-text-small)/1 var(--bw-font-body); border: var(--bw-border-width) solid transparent; border-radius: var(--bw-radius-sm); cursor: pointer;
  transition: background var(--bw-dur-fast) var(--bw-ease-standard), border-color var(--bw-dur-fast) var(--bw-ease-standard), transform var(--bw-dur-instant) var(--bw-ease-standard); }
.bw-btn:focus-visible { outline: var(--bw-focus-width) solid var(--bw-focus); outline-offset: var(--bw-focus-offset); }
.bw-btn:active { transform: translateY(1px); }
.bw-btn[disabled], .bw-btn.is-disabled { opacity: .4; cursor: not-allowed; }
.bw-btn--primary { background: var(--bw-brand); color: var(--bw-on-brand); border-radius: 0; clip-path: polygon(0 0, calc(100% - var(--c)) 0, 100% var(--c), 100% 100%, var(--c) 100%, 0 calc(100% - var(--c))); }
.bw-btn--primary:hover, .bw-btn--primary.is-hover { background: color-mix(in srgb, var(--bw-brand) 86%, var(--bw-text)); }
.bw-btn--secondary { background: transparent; color: var(--bw-text); border-color: var(--bw-border-strong); }
.bw-btn--secondary:hover, .bw-btn--secondary.is-hover { background: var(--bw-surface-sunken); }
.bw-btn--ghost { background: transparent; color: var(--bw-brand-text); }
.bw-btn--ghost:hover, .bw-btn--ghost.is-hover { background: var(--bw-high-bg); }
.bw-btn--danger { background: var(--bw-low); color: #fff; }
[data-theme="dark"] .bw-btn--danger { color: var(--bw-ink-950); }

/* Inputs */
.bw-input { height: 40px; width: 100%; padding: 0 var(--bw-space-3); background: var(--bw-surface); color: var(--bw-text); border: var(--bw-border-width) solid var(--bw-border-strong); border-radius: var(--bw-radius-sm); font: 400 var(--bw-text-body)/1 var(--bw-font-body); }
.bw-input::placeholder { color: var(--bw-text-muted); }
.bw-input:hover { border-color: var(--bw-text-muted); }
.bw-input:focus, .bw-input.is-focus { outline: var(--bw-focus-width) solid var(--bw-focus); outline-offset: 0; border-color: var(--bw-focus); }
.bw-input.is-error { border-color: var(--bw-low); }
.bw-help { font-size: var(--bw-text-caption); color: var(--bw-text-muted); margin-top: var(--bw-space-1); }
.bw-help.is-error { color: var(--bw-low-text); }

/* Band badge: the product's core component */
.bw-badge { --c: 6px; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; font: 600 11px/1 var(--bw-font-mono); letter-spacing: var(--bw-track-label); text-transform: uppercase;
  clip-path: polygon(0 0, calc(100% - var(--c)) 0, 100% var(--c), 100% 100%, var(--c) 100%, 0 calc(100% - var(--c))); }
.bw-badge::before { content: ""; width: 6px; height: 6px; background: currentColor; }
.bw-badge--high { background: var(--bw-high-bg); color: var(--bw-high-text); }
.bw-badge--medium { background: var(--bw-medium-bg); color: var(--bw-medium-text); }
.bw-badge--low { background: var(--bw-low-bg); color: var(--bw-low-text); }

/* Card + decision card */
.bw-card { background: var(--bw-surface); border: var(--bw-border-width) solid var(--bw-border); border-radius: var(--bw-radius-md); padding: var(--bw-space-5); }
.bw-decision { display: grid; gap: var(--bw-space-3); }
.bw-decision__title { font: 700 var(--bw-text-h3)/var(--bw-lh-h3) var(--bw-font-display); font-stretch: 125%; letter-spacing: -0.01em; margin: 0; }
.bw-decision__row { display: grid; grid-template-columns: 72px 1fr; gap: var(--bw-space-3); padding-top: var(--bw-space-3); border-top: var(--bw-border-width) solid var(--bw-border); font-size: var(--bw-text-small); }

/* Confidence ruler: 0 to 1, bands at 0.55 and 0.80 */
.bw-ruler { position: relative; height: 12px; background: linear-gradient(90deg, var(--bw-low) 0 55%, var(--bw-medium) 55% 80%, var(--bw-high) 80% 100%); }
.bw-ruler__mark { position: absolute; top: -6px; width: 2px; height: 24px; background: var(--bw-text); left: var(--score, 71%); transition: left var(--bw-dur-walk) var(--bw-ease-walk); }

/* Table, tabs, alert, code, tooltip, nav */
.bw-table { width: 100%; border-collapse: collapse; font-size: var(--bw-text-small); }
.bw-table th { text-align: left; font: 500 11px/1 var(--bw-font-mono); letter-spacing: var(--bw-track-label); text-transform: uppercase; color: var(--bw-text-muted); padding: var(--bw-space-3); border-bottom: 1px solid var(--bw-border-strong); }
.bw-table td { padding: var(--bw-space-3); border-bottom: 1px solid var(--bw-border); }
.bw-table tr:hover td { background: var(--bw-surface-sunken); }
.bw-tabs { display: flex; gap: var(--bw-space-5); border-bottom: 1px solid var(--bw-border); }
.bw-tab { padding: var(--bw-space-3) 0; font-weight: 500; color: var(--bw-text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.bw-tab[aria-selected="true"] { color: var(--bw-text); border-bottom-color: var(--bw-brand); }
.bw-alert { display: flex; gap: var(--bw-space-3); padding: var(--bw-space-4); border-left: 3px solid; font-size: var(--bw-text-small); }
.bw-alert--info { background: var(--bw-high-bg); border-color: var(--bw-high); }
.bw-alert--warn { background: var(--bw-medium-bg); border-color: var(--bw-medium); }
.bw-alert--error { background: var(--bw-low-bg); border-color: var(--bw-low); }
.bw-code { font: 400 13px/1.6 var(--bw-font-mono); background: var(--bw-surface-sunken); border: 1px solid var(--bw-border); border-radius: var(--bw-radius-sm); padding: var(--bw-space-4); overflow: auto; }
.bw-tooltip { background: var(--bw-text); color: var(--bw-bg); font-size: var(--bw-text-caption); padding: 6px 10px; border-radius: var(--bw-radius-sm); }
.bw-trail { height: 0; border-top: 3px dotted var(--bw-border-strong); }  /* the trail motif as a divider */
</style>
